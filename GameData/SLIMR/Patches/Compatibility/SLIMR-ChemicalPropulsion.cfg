@PART:HAS[#chemTechTankType[bipropellant],@MODULE[ModuleIgnitionTankController]:HAS[#moduleID[chemTechFuel*]]]:FOR[zzzzzz_SLIMR]
{
	@MODULE[ModuleIgnitionTankController]:HAS[#moduleID[chemTechFuel*]],*
	{
		@addedMass /= #$@B9_TANK_TYPE[LFO]/tankMassRatio$
	}
}

@PART:HAS[#chemTechTankType[cryogenic],@MODULE[ModuleIgnitionTankController]:HAS[#moduleID[chemTechPropellant*]]]:FOR[zzzzzz_SLIMR]
{
	@MODULE[ModuleIgnitionTankController]:HAS[#moduleID[chemTechPropellant*]],*
	{
		@addedMass /= #$@B9_TANK_TYPE[LH2]/tankMassRatio$
	}
}

