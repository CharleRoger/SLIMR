// CryoTanks
@B9_TANK_TYPE[OX]
{
	tankMassRatio = #$tankMass$
	@tankMass = #$@SLIMRConfig/tankDensityOxidizer$
	@tankMassRatio /= #$tankMass$
}
@B9_TANK_TYPE[LH2,LH2Cryo]
{
	tankMassRatio = #$tankMass$
	@tankMass = #$@SLIMRConfig/tankDensityLqdHydrogen$
	@tankMassRatio /= #$tankMass$
	@RESOURCE[LqdHydrogen]
	{
		@unitsPerVolume = 5
	}
}
@B9_TANK_TYPE[LH2O,LH2OCryo]
{
	tankMassRatio = #$tankMass$
	@tankMass = #$@SLIMRConfig/tankDensityLqdHydrogen$
	@tankMass *= 3 // 3 / 1
	@tankMass += #$@SLIMRConfig/tankDensityOxidizer$
	@tankMass /= 4 // (3 + 1) / 1 
	@tankMassRatio /= #$tankMass$
	@RESOURCE[LqdHydrogen]
	{
		@unitsPerVolume = 4.6875
	}
	@RESOURCE[Oxidizer]
	{
		@unitsPerVolume = 0.3125
	}
}
@B9_TANK_TYPE[LF]
{
	tankMassRatio = #$tankMass$
	@tankMass = #$@SLIMRConfig/tankDensityLiquidFuel$
	@tankMassRatio /= #$tankMass$
}
@B9_TANK_TYPE[LFOX]
{
	tankMassRatio = #$tankMass$
	@tankMass = #$@SLIMRConfig/tankDensityOxidizer$
	@tankMass *= 1.222222222222222 // 11 / 9
	@tankMass += #$@SLIMRConfig/tankDensityLiquidFuel$
	@tankMass /= 2.222222222222222 // (11 + 9) / 9
	@tankMassRatio /= #$tankMass$
}
@B9_TANK_TYPE[LM]
{
	tankMassRatio = #$tankMass$
	@tankMass = #$@SLIMRConfig/tankDensityLqdMethane$
	@tankMassRatio /= #$tankMass$
}
@B9_TANK_TYPE[LMOx]
{
	tankMassRatio = #$tankMass$
	@tankMass = #$@SLIMRConfig/tankDensityOxidizer$
	@tankMass *= 0.6 // 5 / 3
	@tankMass += #$@SLIMRConfig/tankDensityLqdMethane$
	@tankMass /= 1.6 // (5 + 3) / 3
	@tankMassRatio /= #$tankMass$
}