// B9Partswitch default
@B9_TANK_TYPE[LiquidFuel]
{
	tankMassRatio = #$tankMass$
	@tankMass = #$@SLIMRConfig/tankDensityLiquidFuel$
	@tankMassRatio /= #$tankMass$
}
@B9_TANK_TYPE[LFO]
{
	tankMassRatio = #$tankMass$
	@tankMass = #$@SLIMRConfig/tankDensityOxidizer$
	@tankMass *= 1.222222222222222 // 11 + 9
	@tankMass += #$@SLIMRConfig/tankDensityLiquidFuel$
	@tankMass /= 2.222222222222222 // (11 + 9) / 9
	@tankMassRatio /= #$tankMass$
}
@B9_TANK_TYPE[MonoPropellant]
{
	tankMassRatio = #$tankMass$
	@tankMass = #$@SLIMRConfig/tankDensityMonoPropellant$
	@tankMassRatio /= #$tankMass$
}