// Subtract tank mass
@PART:HAS[#ppuVolumeOxidizer,#ppuTankMassOxidizer]:BEFORE[zzzzzz_SLIMR]
{
	@mass -= #$ppuTankMassOxidizer$
}
@PART:HAS[#ppuVolumeLiquidFuel,#ppuTankMassLiquidFuel]:BEFORE[zzzzzz_SLIMR]
{
	@mass -= #$ppuTankMassLiquidFuel$
}
@PART:HAS[#ppuVolumeLqdHydrogen,#ppuTankMassLqdHydrogen]:BEFORE[zzzzzz_SLIMR]
{
	@mass -= #$ppuTankMassLqdHydrogen$
}
@PART:HAS[#ppuVolumeMonoPropellant,#ppuTankMassMonoPropellant]:BEFORE[zzzzzz_SLIMR]
{
	@mass -= #$ppuTankMassMonoPropellant$
}
@PART:HAS[#ppuVolumeSolidFuel,#ppuTankMassSolidFuel]:BEFORE[zzzzzz_SLIMR]
{
	@mass -= #$ppuTankMassSolidFuel$
}

// Rescale mass
@PART:HAS[#ppuEngine[true],~ppuHeatShield[true],~ppuPod[true],~ppuTank[true]]:FOR[zzzzzz_SLIMR]
{
	@mass *= #$@SLIMRConfig/engineFactor$
}
@PART:HAS[~ppuEngine[true],#ppuHeatShield[true],~ppuPod[true],~ppuTank[true]]:FOR[zzzzzz_SLIMR]
{
	@mass *= #$@SLIMRConfig/heatshieldFactor$
}
@PART:HAS[~ppuEngine[true],~ppuHeatShield[true],#ppuPod[true],~ppuTank[true]]:FOR[zzzzzz_SLIMR]
{
	@mass *= #$@SLIMRConfig/podFactor$
}
@PART:HAS[~ppuEngine[true],~ppuHeatShield[true],~ppuPod[true],~ppuTank[true]]:FOR[zzzzzz_SLIMR]
{
	@mass *= #$@SLIMRConfig/structFactor$
}
@PART:HAS[#ppuVolumeLiquidFuel,~ppuVolumeOxidizer,@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]]:FOR[zzzzzz_SLIMR]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE:HAS[#ppuVolume,#tankType],*
		{
			@addedMass /= #$@B9_TANK_TYPE[LF]/tankMassRatio$
		}
	}
}
@PART:HAS[#ppuVolumeLiquidFuel,#ppuVolumeOxidizer,@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]]:FOR[zzzzzz_SLIMR]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE:HAS[#ppuVolume,#tankType],*
		{
			@addedMass /= #$@B9_TANK_TYPE[LFOX]/tankMassRatio$
		}
	}
}
@PART:HAS[#ppuVolumeLqdHydrogen,~ppuVolumeOxidizer,@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]]:FOR[zzzzzz_SLIMR]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE:HAS[#ppuVolume,#tankType],*
		{
			@addedMass /= #$@B9_TANK_TYPE[LH2]/tankMassRatio$
		}
	}
}
@PART:HAS[#ppuVolumeLqdHydrogen,#ppuVolumeOxidizer,@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]]:FOR[zzzzzz_SLIMR]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE:HAS[#ppuVolume,#tankType],*
		{
			@addedMass /= #$@B9_TANK_TYPE[LH2O]/tankMassRatio$
		}
	}
}

// Rebalance heatshields
@PART:HAS[@MODULE[ModuleAblator]]:AFTER[zzzzzz_SLIMR]
{
	@MODULE[ModuleAblator]
	{
		@lossConst *= 0.5
	}

	@RESOURCE[Ablator],*
	{
		@amount *= 0.25
		@maxAmount *= 0.25
	}
}

// Add tank mass
@PART:HAS[#ppuVolumeOxidizer,#ppuTankMassOxidizer]:AFTER[zzzzzz_SLIMR]
{
	TankMassOxidizer = #$ppuVolumeOxidizer$
	@TankMassOxidizer *= #$@SLIMRConfig/tankDensityOxidizer$
	@mass += #$TankMassOxidizer$
}
@PART:HAS[#ppuVolumeLiquidFuel,#ppuTankMassLiquidFuel]:AFTER[zzzzzz_SLIMR]
{
	TankMassLiquidFuel = #$ppuVolumeLiquidFuel$
	@TankMassLiquidFuel *= #$@SLIMRConfig/tankDensityLiquidFuel$
	@mass += #$TankMassLiquidFuel$
}
@PART:HAS[#ppuVolumeLqdHydrogen,#ppuTankMassLqdHydrogen]:AFTER[zzzzzz_SLIMR]
{
	TankMassLqdHydrogen = #$ppuVolumeLqdHydrogen$
	@TankMassLqdHydrogen *= #$@SLIMRConfig/tankDensityLqdHydrogen$
	@mass += #$TankMassLqdHydrogen$
}
@PART:HAS[#ppuVolumeMonoPropellant,#ppuTankMassMonoPropellant]:AFTER[zzzzzz_SLIMR]
{
	TankMassMonoPropellant = #$ppuVolumeMonoPropellant$
	@TankMassMonoPropellant *= #$@SLIMRConfig/tankDensityMonoPropellant$
	@mass += #$TankMassMonoPropellant$
}
@PART:HAS[#ppuVolumeSolidFuel,#ppuTankMassSolidFuel]:AFTER[zzzzzz_SLIMR]
{
	TankMassSolidFuel = #$ppuVolumeSolidFuel$
	@TankMassSolidFuel *= #$@SLIMRConfig/tankDensitySolidFuel$
	@mass += #$TankMassSolidFuel$
}